name: Mise à jour des données

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (tout) ou orderflow (signal seulement)"
        required: true
        default: full
        type: choice
        options:
          - full
          - orderflow
      notifier:
        description: "Forcer la notification de séance, pour un essai"
        required: true
        default: non
        type: choice
        options:
          - non
          - oui
  schedule:
    # Publication environ 15 min avant la lecture du bureau.
    # Heures de Paris : 06:40, 07:40, 13:40, 16:40, 20:45.
    # Les deux décalages (hiver UTC+1, été UTC+2) sont couverts.
    # Le résumé ntfy part à la fin du run si l'heure de Paris est dans la fenêtre.
    - cron: "40 4 * * 1-5"   # 06:40 été
    - cron: "40 5 * * 1-5"   # 06:40 hiver / 07:40 été
    - cron: "40 6 * * 1-5"   # 07:40 hiver
    - cron: "40 11 * * 1-5"  # 13:40 été
    - cron: "40 12 * * 1-5"  # 13:40 hiver
    - cron: "40 14 * * 1-5"  # 16:40 été
    - cron: "40 15 * * 1-5"  # 16:40 hiver
    - cron: "45 18 * * 1-5"  # 20:45 été
    - cron: "45 19 * * 1-5"  # 20:45 hiver
    # Contrôle orderflow toutes les heures, 07:05–21:05 heure de Paris (union été + hiver).
    - cron: "5 5-20 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: xauusd-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests des règles
        run: python scripts/test_desk.py

      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.notifier }}" = "oui" ]; then
              echo "extra=--force-summary" >> "$GITHUB_OUTPUT"
            else
              echo "extra=" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ github.event.schedule }}" in
              5\ *) echo "mode=orderflow" >> "$GITHUB_OUTPUT" ;;
              *) echo "mode=full" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Télécharger et calculer
        env:
          PYTHONUNBUFFERED: "1"
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          PAGES_URL: https://geoffreygrandon-lang.github.io/xauusd-desk/
        run: python scripts/desk.py --mode "${{ steps.mode.outputs.mode }}" ${{ steps.mode.outputs.extra }} --max-hours 6

      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/candles.json data/alert_state.json data/macro_cache.json
          if [ -f data/absent_hours.json ]; then git add data/absent_hours.json; fi
          if [ -f data/minutes.json ]; then git add data/minutes.json; fi
          if [ -f data/ff_calendar.json ]; then git add data/ff_calendar.json; fi
          if [ -f data/news_cache.json ]; then git add data/news_cache.json; fi
          if git diff --staged --quiet; then
            echo "Aucun changement de données"
          else
            git commit -m "data: mise à jour XAU/USD"
            git pull --rebase origin main
            git push
          fi

      - name: Assembler le site
        run: bash scripts/assemble_site.sh

      # Tant que Pages n'est pas activé dans les réglages du dépôt, ces étapes
      # échouent sans faire échouer la mise à jour des données.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
